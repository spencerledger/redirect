<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <link rel="icon" href="https://cdn.spencers.zone/images/error.ico" type="image/x-icon">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: white;
            font-family: 'Google Sans', Arial, sans-serif;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .background-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.15;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            padding: 40px;
            box-sizing: border-box;
            justify-items: center;
            align-items: center;
        }

        .floating-text {
            font-size: 2rem;
            font-weight: 700;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .main-container {
            text-align: center;
            z-index: 2;
            position: relative;
        }

        h1 {
            font-size: 8rem;
            margin: 0;
            font-weight: 700;
        }

        p {
            font-size: 2rem;
            margin: -20px 0 0 0;
            font-weight: 400;
        }

        .framework-logo {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 10;
            width: 240px;
            height: auto;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        .framework-logo:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="background-text">
        <div class="floating-text">something went wrong</div>
        <div class="floating-text">directory doesn't exist</div>
        <div class="floating-text">Page Not Found</div>
        <div class="floating-text">are you lost?</div>
        <div class="floating-text">the spencers.zone framework</div>
        <div class="floating-text">something went wrong</div>
        <div class="floating-text">directory doesn't exist</div>
        <div class="floating-text">Page Not Found</div>
        <div class="floating-text">are you lost?</div>
        <div class="floating-text">the spencers.zone framework</div>
        <div class="floating-text">page missing</div>
        <div class="floating-text">error 404</div>
    </div>

    <div class="main-container">
        <h1>HTTP 404</h1>
        <p>response</p>
    </div>

    <a href="https://www.spencers.zone/framework" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn.spencers.zone/images/spencerszoneframework-whitebg.png" alt="Spencers.zone Framework" class="framework-logo">
    </a>
</body>
</html>
